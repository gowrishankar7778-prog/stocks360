<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" role="img" aria-labelledby="stocks360LogoTitle stocks360LogoDesc">
  <title id="stocks360LogoTitle">Stocks 360 Logo</title>
  <desc id="stocks360LogoDesc">A 360-degree circular emblem enclosing rising financial chart bars and an upward trend arrow alongside the Stocks 360 wordmark.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="growthGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
  </defs>

  <!-- Emblem Container -->
  <g transform="translate(4, 4)">
    <!-- Deep Navy Circular Badge -->
    <circle cx="28" cy="28" r="26" fill="url(#bgGrad)" />

    <!-- 360 Degree Orbital Arc -->
    <path d="M 28 4 A 24 24 0 1 1 6.5 17.5" fill="none" stroke="url(#ringGrad)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Orbital Arrowhead at top-left -->
    <polygon points="4,12 11,16 4.5,20" fill="#38bdf8" />

    <!-- Rising Candlestick / Bar Chart Inside Emblem -->
    <rect x="15" y="30" width="5" height="11" rx="1.5" fill="url(#barGrad)" />
    <rect x="23.5" y="24" width="5" height="17" rx="1.5" fill="url(#barGrad)" />
    <rect x="32" y="17" width="5" height="24" rx="1.5" fill="url(#growthGrad)" />

    <!-- Dynamic Upward Trend Line & Node -->
    <path d="M 14 27 L 23 20 L 30 22 L 40 12" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="40" cy="12" r="2.8" fill="#4ade80" />
  </g>

  <!-- Wordmark: STOCKS 360 -->
  <g transform="translate(68, 0)">
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="25" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
      Stocks <tspan fill="#2563eb">360</tspan>
    </text>
    <!-- Degree Symbol Badge -->
    <circle cx="137" cy="17" r="3.2" fill="none" stroke="#16a34a" stroke-width="2.2" />
    <!-- Subtitle inside Logo -->
    <text x="1" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#475569" letter-spacing="1.4">
      LEARN &#8226; TRACK &#8226; GROW
    </text>
  </g>
</svg>
