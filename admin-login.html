<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Stocks 360</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-body">
  <div class="top-disclaimer" role="note">
    <p><strong>Disclaimer:</strong> This website is for educational purposes and does not constitute investment advice in any manner.</p>
  </div>

  <main class="admin-login-container">
    <div class="admin-login-box">
      <div class="admin-brand-header">
        <div class="brand-badge">RESTRICTED ADMIN PORTAL</div>
        <h1>Stocks 360</h1>
        <p class="subtitle">Private Administrator Sign-In (Firebase Auth Protected)</p>
      </div>

      <div id="login-message" aria-live="polite" class="login-feedback"></div>

      <!-- GOOGLE SIGN-IN FOR ADMIN -->
      <div style="margin-bottom: 18px;">
        <button type="button" id="google-admin-login-btn" class="admin-btn secondary large full-width" style="display:flex; align-items:center; justify-content:center; gap:10px; font-weight:600; border:2px solid #cbd5e1;">
          <span>&#128274; Sign in with Google (Founder / Admin)</span>
        </button>
      </div>

      <div style="text-align:center; color:#64748b; font-size:13px; margin: 12px 0;">&mdash; OR SIGN IN WITH ADMIN EMAIL &mdash;</div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label for="admin-email">Admin Email <span class="required">*</span></label>
          <input type="email" id="admin-email" required placeholder="Enter authorized admin email" autocomplete="email">
        </div>

        <div class="form-group password-group">
          <div class="label-row">
            <label for="admin-password">Password <span class="required">*</span></label>
            <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="Show password">Show</button>
          </div>
          <input type="password" id="admin-password" required placeholder="Enter admin password" autocomplete="current-password">
        </div>

        <div class="form-group-inline">
          <label class="checkbox-label">
            <input type="checkbox" id="admin-remember" checked>
            <span>Keep me signed in on this browser</span>
          </label>
        </div>

        <button type="submit" class="admin-btn primary large full-width">Sign In to Admin Panel</button>
      </form>

      <div class="admin-login-footer">
        <a href="index.html">&larr; Back to Public Website</a>
      </div>
    </div>
  </main>

  <!-- Firebase Cloud SDKs & Configuration -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=8"></script>
  <script src="js/admin-auth.js?v=8"></script>
  <script src="js/admin-login.js?v=8"></script>
</body>
</html>
