<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Stocks 360 - Stay Updated with the Stock Market While Learning</title>
  <meta name="description" content="Stocks 360 helps you understand the stock market through accessible learning modules, audio assistance, and educational insights.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function () {
      var BUILD_VERSION = "20261107_v52";
      try {
        var last = localStorage.getItem("stocks360_active_build");
        if (last !== BUILD_VERSION) {
          localStorage.setItem("stocks360_active_build", BUILD_VERSION);
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && k.indexOf("stocks360_gemini_profile_") === 0) {
              localStorage.removeItem(k);
            }
          }
        }
      } catch (_) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="assets/stocks360-mark.svg">
  <link rel="stylesheet" href="css/styles.css?v=62">
</head>
<body>

  <!-- 1. SKIP TO MAIN CONTENT LINK (JUMPS TO HOME LINK) -->
  <a class="skip-link" href="#home-nav-link">Skip to main content</a>

  <!-- 2. TOP ACCESSIBILITY BUTTON & HEADER BAR -->
  <header class="top-bar">
    <div class="container top-bar-flex">
      <div class="top-controls">
        <button id="accessibility-toggle" aria-pressed="false" class="a11y-toggle-btn">
          Turn On Special Accessibility
        </button>
      </div>
      <div id="nav-auth-container" class="top-auth-box"></div>
    </div>
  </header>

  <!-- 3. SEARCH FOR STOCKS SECTION (GLOBAL COMPANY SEARCH & ANALYSIS) -->
  <section class="top-search-section" aria-label="Search for Stocks">
    <div class="container">
      <div class="stock-search-card">
        <label for="stock-search" class="search-label" style="font-weight:700; color:#1e293b; display:block; margin-bottom:8px;">
          Search Companies for Detailed Analysis &amp; News
        </label>

        <div class="search-input-wrapper">
          <div class="search-field-container" style="position:relative; flex:1;">
            <input type="search" id="stock-search" placeholder="Type company name or symbol (e.g. HSCL, Aegis Logistics, TCS, INFY, HDFC Bank, Reliance)..." aria-label="Search for stocks" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-controls="stock-search-suggestions">
          </div>
          <button type="button" id="search-button" class="btn-primary">Search Company</button>
        </div>

        <!-- COMPANY ANALYSIS RESULT CARD (HIDDEN UNTIL USER SEARCHES OR SELECTS A COMPANY) -->
        <section id="stock-result" class="stock-result-card" aria-live="polite" hidden></section>
      </div>
    </div>
  </section>

  <!-- 4. STOCKS 360 AI BUTTON (BEFORE MAIN LINKS) -->
  <div class="stock360-ai-section">
    <div class="container">
      <div class="stock360-ai-banner">
        <div class="stock360-ai-actions">
          <button type="button" id="home-ask360-btn" class="ask360-btn btn-ask360-ai" aria-expanded="false" aria-controls="home-ask360-drawer">
            Ask Stocks 360 AI about the current market trends
          </button>
        </div>
      </div>

      <div id="home-ask360-drawer" class="ask360-box stock360-ai-drawer" hidden>
        <label for="home-ask360-input" class="search-label">Ask Stocks 360 AI a Question</label>
        <div class="search-input-wrapper">
          <input type="text" id="home-ask360-input" placeholder="Type your question about the markets or current trends...">
          <button type="button" id="home-ask360-send" class="btn-primary">Ask Stocks 360 AI</button>
        </div>
        <div id="home-ask360-response" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <!-- 5. MAIN NAVIGATION LINKS -->
  <nav id="main-navigation" aria-label="Main navigation">
    <div class="container">
      <ul>
        <li><a href="index.html" id="home-nav-link" class="active" aria-current="page">Home</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="mutual-funds.html">Mutual Funds</a></li>
        <li><a href="learn.html">Learn Modules</a></li>
        <li><a href="screener.html">Screener</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </div>
  </nav>

  <!-- 6. MAIN CONTENT -->
  <main id="main-content" tabindex="-1"></main>

  <footer>
    <div class="container">
      <p class="footer-disclaimer" role="note"><strong>Disclaimer:</strong> Any article or learning material published on this website is purely meant for educational purposes only and does not constitute investment advice in any manner.</p>
    </div>
  </footer>

  <!-- Firebase Cloud SDKs & Configuration -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=62"></script>
  <script src="js/auth.js?v=62"></script>
  <script src="js/data-store.js?v=62"></script>
  <script src="js/gemini-ai.js?v=62"></script>
  <script src="js/main.js?v=62"></script>
  <script src="js/accessibility.js?v=62"></script>
  <script src="js/screener-index.js?v=62"></script>
  <script src="js/stock-search.js?v=62"></script>
  <script src="js/smart-assist.js?v=62"></script>
</body>
</html>
