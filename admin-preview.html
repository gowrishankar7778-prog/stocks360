<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Preview - Stocks 360</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .preview-banner {
      background: #eff6ff;
      color: #1e40af;
      text-align: center;
      padding: 14px;
      font-weight: 700;
      border-bottom: 2px solid #3b82f6;
    }
    .preview-content {
      max-width: 820px;
      margin: 30px auto;
      padding: 24px;
      line-height: 1.75;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.08);
    }
    .preview-content table {
      border-collapse: collapse;
      width: 100%;
      margin: 18px 0;
    }
    .preview-content th,
    .preview-content td {
      border: 1px solid #cbd5e1;
      padding: 10px 14px;
      text-align: left;
    }
    .preview-content th {
      background: #f1f5f9;
      font-weight: 700;
    }
    .preview-meta {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 0.95rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 18px;
      background: #334155;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    .back-btn:hover {
      background: #1e293b;
    }
  </style>
</head>
<body style="background: #f8fafc;">

  <div class="preview-banner">
    &#128065; PREVIEW MODE &bull; This is exactly how your article will look on the live website
  </div>

  <div class="preview-content">
    <a href="#" class="back-btn" onclick="window.close(); return false;">&larr; Close Preview Window</a>

    <h1 id="preview-title" style="font-size: 2.2rem; color: #0f172a; margin-bottom: 10px;">Title</h1>
    <p class="preview-meta" id="preview-meta"></p>

    <!-- LISTEN TO THE ARTICLE BUTTON & EXPANDABLE AUDIO CONTROLS (ABOVE NEWS CONTENT) -->
    <div class="article-listen-wrapper">
      <button type="button" id="listen-article-btn" class="listen-article-trigger-btn" aria-expanded="false" aria-controls="news-audio-player-card">
        Listen to the Article
      </button>

      <section id="news-audio-player-card" class="news-audio-player-card" aria-label="Article Audio Controls" hidden>
        <audio id="news-html5-audio" preload="none" hidden></audio>

        <div class="audio-controls-bar">
          <div class="audio-transport-group">
            <button type="button" id="audio-play-pause-btn" class="audio-btn audio-btn-play" aria-label="Pause">
              <span id="audio-play-icon" aria-hidden="true">&#10074;&#10074;</span>
              <span id="audio-play-label">Pause</span>
            </button>

            <button type="button" id="audio-rewind-10-btn" class="audio-btn audio-btn-skip" aria-label="Rewind 10 seconds" title="Rewind 10 seconds">
              &#8630; -10s
            </button>

            <button type="button" id="audio-forward-10-btn" class="audio-btn audio-btn-skip" aria-label="Fast forward 10 seconds" title="Fast forward 10 seconds">
              +10s &#8631;
            </button>
          </div>

          <div class="audio-seek-group">
            <span id="audio-current-time" class="audio-time-label" aria-live="off">0:00</span>
            <label for="audio-seek-slider" class="visually-hidden">Seek position</label>
            <input type="range" id="audio-seek-slider" class="audio-seek-slider" min="0" max="100" step="0.1" value="0" aria-label="Seek position">
            <span id="audio-total-duration" class="audio-time-label">0:00</span>
          </div>

          <div class="audio-speed-group">
            <label for="audio-speed-select" class="audio-speed-label">Speed:</label>
            <select id="audio-speed-select" class="audio-speed-select" aria-label="Playback speed">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </div>
        </div>
      </section>
    </div>

    <div id="preview-synopsis" class="news-synopsis" style="display:none;"></div>

    <div id="preview-body" class="article-main-body"></div>

    <div id="preview-glossary" class="news-glossary" style="display:none; margin-top:25px;"></div>
    <div id="preview-keywords" class="news-keywords" style="display:none; margin-top:15px;"></div>
    <div id="preview-takeaways" class="lesson-takeaways-card" style="display:none; margin-top:25px;"></div>
  </div>

  <script>
    // Load preview data from sessionStorage or localStorage
    const rawData = sessionStorage.getItem("stocks360_preview_data") || localStorage.getItem("previewData") || "{}";
    const data = JSON.parse(rawData);

    document.getElementById("preview-title").textContent = data.title || "Untitled Article";

    let meta = "";
    if (data.author) meta += "By " + data.author;
    if (data.published) meta += (meta ? " • " : "") + data.published;
    document.getElementById("preview-meta").textContent = meta;

    if (data.synopsis) {
      const el = document.getElementById("preview-synopsis");
      el.textContent = data.synopsis;
      el.style.display = "block";
    }

    const bodyContent = data.content || data.body || "<p>No content written yet.</p>";
    document.getElementById("preview-body").innerHTML = bodyContent;

    if (data.glossary) {
      const el = document.getElementById("preview-glossary");
      el.innerHTML = "<strong>Glossary Terms:</strong><br>" + data.glossary.replace(/\n/g, "<br>");
      el.style.display = "block";
    }

    if (data.keywords) {
      const el = document.getElementById("preview-keywords");
      el.innerHTML = "<strong>Keywords:</strong> " + data.keywords;
      el.style.display = "block";
    }

    if (data.takeaways) {
      const el = document.getElementById("preview-takeaways");
      el.innerHTML = "<strong>Key Takeaways:</strong><br>" + data.takeaways.replace(/\n/g, "<br>");
      el.style.display = "block";
    }
  </script>
  <script src="js/audio-engine.js?v=7"></script>
  <script>
    if (typeof StocksAudioEngine !== "undefined") {
      StocksAudioEngine.mountArticlePlayer(data, {
        triggerBtn: document.getElementById("listen-article-btn"),
        containerEl: document.getElementById("news-audio-player-card"),
        audioEl: document.getElementById("news-html5-audio"),
        playPauseBtn: document.getElementById("audio-play-pause-btn"),
        playPauseIcon: document.getElementById("audio-play-icon"),
        playPauseLabel: document.getElementById("audio-play-label"),
        rewind10Btn: document.getElementById("audio-rewind-10-btn"),
        forward10Btn: document.getElementById("audio-forward-10-btn"),
        seekSlider: document.getElementById("audio-seek-slider"),
        currentTimeEl: document.getElementById("audio-current-time"),
        totalDurationEl: document.getElementById("audio-total-duration"),
        speedSelect: document.getElementById("audio-speed-select")
      });
    }
  </script>
</body>
</html>
