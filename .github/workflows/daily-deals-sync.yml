name: Daily NSE Bulk & Block Deals Sync (6:43 PM IST)

# Runs automatically at 6:43 PM IST every weekday (Monday through Friday), skipping NSE holidays
# 6:43 PM IST = 13:13 UTC (13:13 + 5:30 = 18:43 IST)
on:
  schedule:
    - cron: '13 13 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-bulk-block-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Trading Day (Skip Weekends & NSE Holidays)
        id: market_check
        run: |
          node scripts/check-market-open.js

      - name: Fetch Official NSE Bulk & Block Deals (6:43 PM IST)
        if: steps.market_check.outputs.is_open == 'true'
        run: |
          node scripts/update-bulk-block-deals.js

      - name: Fetch Official NSE SEBI PIT Insider Trading Disclosures
        if: steps.market_check.outputs.is_open == 'true'
        run: |
          node scripts/update-insider-trading.js

      - name: Synchronize Official NSE FII/DII Flows & Market Breadth
        if: steps.market_check.outputs.is_open == 'true'
        run: |
          node scripts/update-market-pulse.js

      - name: Synchronize Official NSE IPO Tracker
        if: steps.market_check.outputs.is_open == 'true'
        run: |
          node scripts/update-ipo-tracker.js

      - name: Commit & Push Updated Bulk & Block Deals Dataset
        if: steps.market_check.outputs.is_open == 'true'
        id: git_push
        run: |
          git config user.name "Stocks 360 Market Bot"
          git config user.email "bot@stocks360.local"
          git add data/market/bulk-block-deals.json data/market/insider-trading.json data/market/ipo-tracker.json data/market/nse-holidays.json data/market-pulse.json js/market-pulse-data.js js/ipo-data.js
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No new Bulk or Block Deals detected today."
          else
            git commit -m "Auto-update official NSE Bulk & Block Deals [6:43 PM IST]"
            git pull --rebase --autostash origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render Auto-Deploy
        if: steps.market_check.outputs.is_open == 'true' && steps.git_push.outputs.pushed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✓ Triggered Render auto-deploy!"
          else
            echo "Notice: Set GitHub repo secret RENDER_DEPLOY_HOOK_URL to enable automatic Render deploys."
          fi
