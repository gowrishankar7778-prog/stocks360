name: Daily NSE Bulk & Block Deals Sync (6:45 PM IST)

# Runs automatically at 6:45 PM IST every weekday (Monday through Friday)
# 6:45 PM IST = 13:15 UTC (13:15 + 5:30 = 18:45 IST)
on:
  schedule:
    - cron: '15 13 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-bulk-block-deals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Official NSE Bulk & Block Deals (6:45 PM IST)
        run: |
          node scripts/update-bulk-block-deals.js

      - name: Synchronize Official NSE FII/DII Flows & Market Breadth
        run: |
          node scripts/update-market-pulse.js

      - name: Commit & Push Updated Bulk & Block Deals Dataset
        id: git_push
        run: |
          git config user.name "Stocks 360 Market Bot"
          git config user.email "bot@stocks360.local"
          git add data/market/bulk-block-deals.json data/market-pulse.json js/market-pulse-data.js
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No new Bulk or Block Deals detected today."
          else
            git commit -m "Auto-update official NSE Bulk & Block Deals [6:45 PM IST]"
            git pull --rebase --autostash origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Updated Deals & Pulse to Firebase Hosting
        if: steps.git_push.outputs.pushed == 'true'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STOCKS360 }}
          projectId: project-b005dc8f-09b3-4af6-b2b
          channelId: live

      - name: Trigger Render Auto-Deploy
        if: steps.git_push.outputs.pushed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✓ Triggered Render auto-deploy!"
          else
            echo "Notice: Set GitHub repo secret RENDER_DEPLOY_HOOK_URL to enable automatic Render deploys."
          fi
