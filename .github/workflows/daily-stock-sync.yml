name: Daily Stock Screener Auto-Sync

# Runs automatically at 4:45 PM IST every weekday (Monday through Friday)
# 4:45 PM IST = 11:15 UTC (11:15 + 5:30 = 16:45 IST)
on:
  schedule:
    - cron: '15 11 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Auto-Discover New NSE IPOs & Equity Listings
        run: |
          node scripts/import-all-nse-stocks.js

      - name: Synchronize All Live NSE Prices & Indicators
        run: |
          node scripts/update-nse-stocks.js --all

      - name: Synchronize Official NSE Corporate Announcements & Filings
        run: |
          node scripts/update-nse-news.js

      - name: Synchronize Official Real Company Fundamentals & Annual Statements
        run: |
          node scripts/update-company-fundamentals.js --all

      - name: Commit & Push Updated Stock Data & Filings
        run: |
          git config user.name "Stocks 360 Market Bot"
          git config user.email "bot@stocks360.local"
          git add js/screener-index.js data/news/ data/profiles/ data/mutual-funds/
          if git diff --staged --quiet; then
            echo "No price, indicator, or corporate filing changes detected today."
          else
            git commit -m "Auto-update NSE stock prices, moving averages, indicators, and corporate filings [4:45 PM IST]"
            git push origin main
          fi
