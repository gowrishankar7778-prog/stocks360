name: Daily Mutual Funds AMFI NAV Sync (9:32 PM IST)

# Runs automatically every weekday (Monday through Friday), skipping NSE holidays.
# Staggered backup crons ensure reliability if GitHub Actions drops a scheduled slot.
# 16:02 UTC = 9:32 PM IST | 16:39 UTC = 10:09 PM IST | 17:17 UTC = 10:47 PM IST
on:
  schedule:
    - cron: '2 16 * * 1-5'
    - cron: '39 16 * * 1-5'
    - cron: '17 17 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime from GitHub Actions tab

concurrency:
  group: sync-mf
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-mutual-funds:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SA_SET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Trading Day & Daily Idempotency (Skip Weekends, Holidays & Already-Synced)
        id: market_check
        run: |
          node scripts/check-market-open.js --sync-key=mf

      - name: Fetch AMFI 9:00 PM Daily NAVs & Update Mutual Fund Schemes
        if: steps.market_check.outputs.is_open == 'true'
        run: |
          node scripts/update-mutual-funds.js

      - name: Commit & Push Updated Mutual Funds NAV Dataset
        if: steps.market_check.outputs.is_open == 'true'
        id: git_push
        run: |
          node scripts/check-market-open.js --mark-synced=mf
          git config user.name "Stocks 360 AMFI NAV Bot"
          git config user.email "bot@stocks360.local"
          git add data/mutual-funds/top-mutual-funds.json data/market/nse-holidays.json data/market/sync-state.json
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "No AMFI NAV changes detected today."
          else
            git commit -m "Auto-update daily AMFI Mutual Fund NAVs & holdings [9:32 PM IST]"
            git pull --rebase --autostash origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render Auto-Deploy
        if: steps.market_check.outputs.is_open == 'true' && steps.git_push.outputs.pushed == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✓ Triggered Render auto-deploy!"
          else
            echo "Notice: Set GitHub repo secret RENDER_DEPLOY_HOOK_URL to enable automatic Render deploys."
          fi

      - name: Deploy to Firebase Hosting (stocks360.web.app)
        if: steps.market_check.outputs.is_open == 'true' && steps.git_push.outputs.pushed == 'true' && env.FIREBASE_SA_SET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: project-b005dc8f-09b3-4af6-b2b
