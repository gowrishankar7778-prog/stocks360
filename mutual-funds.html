<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mutual Funds - Stocks 360</title>
  <meta name="description" content="Search any AMC or Mutual Fund Scheme to analyze NAV CAGR and XIRR returns, Risk Ratios, All Stock Holdings, and Top 10 Holdings.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/svg+xml" href="assets/stocks360-mark.svg">
  <link rel="stylesheet" href="css/styles.css?v=53">
</head>
<body>

  <!-- 1. SKIP TO MAIN CONTENT LINK -->
  <a class="skip-link" href="#page-heading">Skip to main content</a>

  <!-- 2. TOP ACCESSIBILITY BUTTON & USER ACCOUNT HEADER BAR -->
  <header class="top-bar">
    <div class="container top-bar-flex">
      <div class="top-controls">
        <button id="accessibility-toggle" aria-pressed="false" class="a11y-toggle-btn">
          Turn On Special Accessibility
        </button>
      </div>
      <div id="nav-auth-container" class="top-auth-box"></div>
    </div>
  </header>

  <!-- 3. MAIN NAVIGATION LINKS -->
  <nav id="main-navigation" aria-label="Main navigation">
    <div class="container">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="mutual-funds.html" class="active" aria-current="page">Mutual Funds</a></li>
        <li><a href="learn.html">Learn Modules</a></li>
        <li><a href="screener.html">Screener</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </div>
  </nav>

  <!-- 4. MAIN CONTENT AREA -->
  <main id="main-content" tabindex="-1">
    <div class="container">
      <div class="detail-container">

        <header style="margin-bottom: 20px;">
          <h1 id="page-heading" tabindex="-1" style="font-size: clamp(1.6rem, 2.5vw, 2.1rem); color: #0f172a; margin: 0;">
            Mutual Funds
          </h1>
        </header>

        <!-- SEARCH AMC OR MUTUAL FUND BOX + TOP MUTUAL FUNDS QUICK PILLS -->
        <section aria-label="Search AMC or Mutual Fund" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; margin-bottom:24px; box-shadow:0 1px 4px rgba(15,23,42,0.04);">
          <label for="mf-search" style="display:block; font-size:0.98rem; font-weight:700; color:#0f172a; margin-bottom:10px;">
            Search AMC or Mutual Fund
          </label>

          <div style="display:flex; gap:10px; flex-wrap:wrap; position:relative;">
            <div style="flex:1; min-width:260px; position:relative;">
              <input
                type="search"
                id="mf-search"
                placeholder="Search AMC (e.g. HDFC, SBI, PPFAS, ICICI, Nippon, Kotak) or Mutual Fund..."
                aria-label="Search AMC or Mutual Fund"
                aria-autocomplete="list"
                aria-controls="mf-search-suggestions"
                aria-expanded="false"
                autocomplete="off"
                style="width:100%; padding:12px 14px; font-size:0.96rem; border:1px solid #cbd5e1; border-radius:8px; color:#0f172a; background:#ffffff;"
              >
              <ul
                id="mf-search-suggestions"
                role="listbox"
                aria-label="AMC and Mutual Fund Suggestions"
                hidden
                style="position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:100; background:#ffffff; border:1px solid #cbd5e1; border-radius:8px; box-shadow:0 10px 24px rgba(15,23,42,0.12); max-height:340px; overflow-y:auto; list-style:none; margin:0; padding:0;"
              ></ul>
            </div>

            <button type="button" id="mf-search-btn" class="btn-primary" style="padding:12px 20px; font-size:0.95rem; font-weight:600; border-radius:8px; cursor:pointer;">
              Search
            </button>
          </div>

          <!-- TOP MUTUAL FUNDS QUICK PILLS -->
          <div style="margin-top:14px; padding-top:12px; border-top:1px solid #f1f5f9;">
            <span style="display:block; font-size:0.76rem; font-weight:600; color:#64748b; margin-bottom:8px;">
              Top Mutual Funds
            </span>
            <div id="mf-top-quick-pills" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
          </div>
        </section>

        <!-- STOCK HOLDINGS RESULTS CONTAINER (Shown when navigated from See This Stock in Mutual Funds) -->
        <section id="mf-stock-holdings-section" aria-live="polite" hidden></section>

        <!-- AMC SCHEMES LIST CONTAINER (Shown when user searches an AMC) -->
        <section id="mf-amc-results-section" aria-live="polite" hidden></section>

        <!-- 4-HEADING MUTUAL FUND SCHEME OVERVIEW -->
        <section id="mf-scheme-overview-section" aria-live="polite" hidden></section>

      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p class="footer-disclaimer" role="note">
        <strong>Disclaimer:</strong> Mutual fund investments are subject to market risks. Please read all scheme-related documents carefully before investing.
      </p>
    </div>
  </footer>

  <!-- Firebase Cloud SDKs & Configuration -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js?v=60"></script>
  <script src="js/auth.js?v=60"></script>
  <script src="js/accessibility.js?v=60"></script>
  <script src="js/mutual-funds.js?v=60"></script>
  <script src="js/smart-assist.js?v=60"></script>
</body>
</html>
