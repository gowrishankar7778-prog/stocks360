<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Update About Us - Stocks 360</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="top-disclaimer" role="note">
    <p><strong>Disclaimer:</strong> This website is only for educational purposes and does not constitute investment advice in any manner.</p>
  </div>

  <header class="admin-header">
    <div class="container">
      <h1>Admin Panel - About Us</h1>
      <p>Logged in as Admin | <a href="login.html" style="color:#fff;">Logout</a></p>
    </div>
  </header>

  <nav class="admin-nav">
    <ul>
      <li><a href="news.html">News</a></li>
      <li><a href="newsletter.html">Newsletter</a></li>
      <li><a href="learn.html">Learn</a></li>
      <li><a href="ask.html">Ask / Comments</a></li>
      <li><a href="about.html" class="active">About Us</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="../index.html">View Website</a></li>
    </ul>
  </nav>

  <main class="container admin-main">

    <h2>Update About Us Content</h2>

    <div class="publish-form-section">
      <div class="form-group">
        <label for="about-content">About Us Content</label>
        <textarea id="about-content" class="multi-input" rows="12" placeholder="Enter or update the About Us content here...">Stocks 360 is an educational website created to help people understand the stock market in a simple and clear way. It includes enhanced accessibility features so that a wider range of users can use it comfortably.

Our Focus
The website is designed with good accessibility practices. Features such as clear structure, keyboard navigation, screen reader support, and a special accessibility mode are included to improve the experience for everyone.

What We Offer
- Simple explanations about the stock market
- Educational news and weekly market overview
- Stock search with live and historical data (after API integration)
- Enhanced accessibility features</textarea>
      </div>

      <button id="update-about-btn" class="admin-btn success large">Update About Us</button>
    </div>

  </main>

  <script>
    document.getElementById("update-about-btn").addEventListener("click", function () {
      const content = document.getElementById("about-content").value.trim();
      if (content === "") {
        alert("About Us content cannot be empty.");
        return;
      }
      alert("About Us updated successfully!\n\n(This is temporary. Real saving will work after Firebase integration.)");
    });
  </script>
</body>
</html>
